name: Release from GitHub Release
on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Get release version from tag
        id: get_version
        run: |
          RELEASE_VERSION=${GITHUB_REF#refs/tags/}
          echo "Extracted version: $RELEASE_VERSION"
          # Validate semver format (MAJOR.MINOR.PATCH)
          echo "$RELEASE_VERSION" | grep -P '^[0-9]+\.[0-9]+\.[0-9]+$'
          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Set projects Maven version to GitHub Release version
        run: ./mvnw versions:set "-DnewVersion=${{ steps.get_version.outputs.release_version }}"

      - name: Check the documentation code samples
        run: |
          ./mvnw --batch-mode -PnoGpg -DskipTests install
          ./mvnw --batch-mode -f scripts/doc-samples/pom.xml verify "-Ddatafaker.version=${{ steps.get_version.outputs.release_version }}"

      - name: Deploy to Maven Central Repository
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          mvn-server-repository-origins: 'central:https://central.sonatype.com'
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
      
      - name: Publish to the Maven Central Repository
        run: ./mvnw --batch-mode clean deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
