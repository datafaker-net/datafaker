en:
  faker:
    database:
      databases:
      - name: "PostgreSQL"
        type: "RELATIONAL"
        dialect: "PostgreSQL"
        port: 5432
        jdbc_driver: "org.postgresql.Driver"
        jdbc_url: "jdbc:postgresql://{host}:{port}/{database}"
        capabilities: "transactions,json,window_functions,cte,upsert,returning"
      - name: "MySQL"
        type: "RELATIONAL"
        dialect: "MySQL"
        port: 3306
        jdbc_driver: "com.mysql.cj.jdbc.Driver"
        jdbc_url: "jdbc:mysql://{host}:{port}/{database}"
        capabilities: "transactions,json,window_functions,cte,upsert"
      - name: "MariaDB"
        type: "RELATIONAL"
        dialect: "MariaDB"
        port: 3306
        jdbc_driver: "org.mariadb.jdbc.Driver"
        jdbc_url: "jdbc:mariadb://{host}:{port}/{database}"
        capabilities: "transactions,json,window_functions,cte,upsert"
      - name: "Oracle Database"
        type: "RELATIONAL"
        dialect: "Oracle SQL"
        port: 1521
        jdbc_driver: "oracle.jdbc.OracleDriver"
        jdbc_url: "jdbc:oracle:thin:@//{host}:{port}/{database}"
        capabilities: "transactions,json,window_functions,cte,upsert,returning"
      - name: "Microsoft SQL Server"
        type: "RELATIONAL"
        dialect: "T-SQL"
        port: 1433
        jdbc_driver: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
        jdbc_url: "jdbc:sqlserver://{host}:{port};databaseName={database}"
        capabilities: "transactions,json,window_functions,cte,upsert"
      - name: "SQLite"
        type: "RELATIONAL"
        dialect: "SQLite"
        port: 0
        jdbc_driver: "org.sqlite.JDBC"
        jdbc_url: "jdbc:sqlite:{database}.db"
        capabilities: "transactions,json,window_functions,cte,upsert"
      - name: "H2"
        type: "RELATIONAL"
        dialect: "H2"
        port: 9092
        jdbc_driver: "org.h2.Driver"
        jdbc_url: "jdbc:h2:mem:{database}"
        capabilities: "transactions,json,window_functions,cte,upsert"
      - name: "MongoDB"
        type: "DOCUMENT"
        dialect: "MongoDB Query Language"
        port: 27017
        jdbc_driver: ""
        jdbc_url: "mongodb://{host}:{port}/{database}"
        capabilities: "transactions,json,upsert"
      - name: "Redis"
        type: "KEY_VALUE"
        dialect: "Redis Commands"
        port: 6379
        jdbc_driver: ""
        jdbc_url: "redis://{host}:{port}"
        capabilities: "transactions"
      - name: "Cassandra"
        type: "WIDE_COLUMN"
        dialect: "CQL"
        port: 9042
        jdbc_driver: ""
        jdbc_url: ""
        capabilities: "json"
      - name: "DynamoDB"
        type: "KEY_VALUE"
        dialect: "DynamoDB Expressions"
        port: 8000
        jdbc_driver: ""
        jdbc_url: "http://{host}:{port}"
        capabilities: "transactions,upsert"
      - name: "Elasticsearch"
        type: "SEARCH"
        dialect: "Elasticsearch Query DSL"
        port: 9200
        jdbc_driver: ""
        jdbc_url: "http://{host}:{port}"
        capabilities: "json,full_text_search"
      sql_types:
      - "CHAR"
      - "VARCHAR"
      - "VARCHAR2"
      - "NVARCHAR"
      - "TEXT"
      - "CLOB"
      - "BLOB"
      - "BOOLEAN"
      - "SMALLINT"
      - "INTEGER"
      - "BIGINT"
      - "DECIMAL"
      - "NUMERIC"
      - "REAL"
      - "DOUBLE"
      - "FLOAT"
      - "DATE"
      - "TIME"
      - "TIMESTAMP"
      - "TIMESTAMP WITH TIME ZONE"
      - "UUID"
      - "JSON"
      - "JSONB"
      - "ARRAY"
      - "XML"
      constraints:
      - "PRIMARY KEY"
      - "FOREIGN KEY"
      - "UNIQUE"
      - "NOT NULL"
      - "CHECK"
      - "DEFAULT"
      index_types:
      - "B-tree"
      - "Hash"
      - "Bitmap"
      - "GIN"
      - "GiST"
      - "BRIN"
      - "Clustered"
      - "Non-clustered"
      isolation_levels:
      - "READ UNCOMMITTED"
      - "READ COMMITTED"
      - "REPEATABLE READ"
      - "SERIALIZABLE"
      sql_states:
      - "00000"
      - "08001"
      - "08006"
      - "22001"
      - "22003"
      - "22012"
      - "23502"
      - "23503"
      - "23505"
      - "23514"
      - "40001"
      - "40P01"
      - "22P02"
      errors:
      - "Connection refused"
      - "Connection timeout"
      - "Authentication failed"
      - "Unique constraint violation"
      - "Foreign key constraint violation"
      - "Not null constraint violation"
      - "Deadlock detected"
      - "Transaction serialization failure"
      - "Data too long for column"
      - "Numeric value out of range"
      - "Invalid text representation"
